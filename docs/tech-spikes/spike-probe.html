<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
window.__log = [];
window.probe = async (sourceId) => {
  const r = { secure: window.isSecureContext, hasMediaDevices: !!navigator.mediaDevices, hasWebCodecs: typeof VideoEncoder !== 'undefined' };
  try {
    if (r.hasWebCodecs) {
      const cfgs = [
        { codec: 'avc1.640028', width: 1920, height: 1080, bitrate: 12000000, framerate: 60, hardwareAcceleration: 'prefer-hardware' },
        { codec: 'avc1.640028', width: 1920, height: 1080, bitrate: 12000000, framerate: 60, hardwareAcceleration: 'prefer-software' },
        { codec: 'avc1.42E01E', width: 1280, height: 720, bitrate: 6000000, framerate: 30 },
        { codec: 'avc1.4D401F', width: 1920, height: 1080, bitrate: 12000000, framerate: 30, avc: { format: 'annexb' } },
        { codec: 'vp09.00.10.08', width: 1920, height: 1080, bitrate: 8000000, framerate: 30 },
      ];
      r.encoderSupport = [];
      for (const c of cfgs) {
        try {
          const s = await VideoEncoder.isConfigSupported(c);
          r.encoderSupport.push({ codec: c.codec, hw: c.hardwareAcceleration || '-', supported: s.supported });
        } catch (e) { r.encoderSupport.push({ codec: c.codec, error: String(e).slice(0, 120) }); }
      }
      r.audioEncoderSupport = [];
      for (const c of [
        { codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 },
        { codec: 'opus', sampleRate: 48000, numberOfChannels: 2, bitrate: 128000 },
      ]) {
        try { const s = await AudioEncoder.isConfigSupported(c); r.audioEncoderSupport.push({ codec: c.codec, supported: s.supported }); }
        catch (e) { r.audioEncoderSupport.push({ codec: c.codec, error: String(e).slice(0, 120) }); }
      }
    }
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 60, max: 60 }, width: { max: 2560 }, height: { max: 1600 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    r.videoTracks = stream.getVideoTracks().map(t => ({ label: t.label, settings: t.getSettings(), state: t.readyState }));
    r.audioTracks = stream.getAudioTracks().map(t => ({ label: t.label, settings: t.getSettings(), state: t.readyState }));
    const v = stream.getVideoTracks()[0];
    const vproc = new MediaStreamTrackProcessor({ track: v });
    const reader = vproc.readable.getReader();
    let frames = 0, first = 0, last = 0, loop = true;
    const sizes = new Set();
    (async () => {
      while (loop) {
        const { value, done } = await reader.read();
        if (done) break;
        if (!first) first = performance.now();
        last = performance.now(); frames++;
        sizes.add(value.displayWidth + 'x' + value.displayHeight);
        value.close();
      }
    })();
    await new Promise(res => setTimeout(res, 1500));
    loop = false; try { await reader.cancel(); } catch {}
    r.frames = frames; r.measuredFps = frames / ((last - first) / 1000 || 1); r.frameSizes = [...sizes];
    if (stream.getAudioTracks().length) {
      const ac = new AudioContext({ sampleRate: 48000 });
      const src = ac.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
      const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
      const buf = new Float32Array(an.fftSize); let peak = 0;
      for (let i = 0; i < 15; i++) { await new Promise(res => setTimeout(res, 80)); an.getFloatTimeDomainData(buf); for (const x of buf) peak = Math.max(peak, Math.abs(x)); }
      r.audioPeak = peak; r.audioContextRate = ac.sampleRate;
      await ac.close();
    }
    stream.getTracks().forEach(t => t.stop());
  } catch (e) { r.error = String(e); }
  return r;
};
window.probeEncode = async () => {
  const r = {};
  try {
    const out = [];
    let gotChunk = false;
    const enc = new VideoEncoder({ output: (c) => { gotChunk = true; c.close(); }, error: (e) => { r.encError = String(e); } });
    enc.configure({ codec: 'avc1.640028', width: 1920, height: 1080, bitrate: 12000000, framerate: 60, latencyMode: 'quality' });
    const canvas = new OffscreenCanvas(1920, 1080);
    const ctx = canvas.getContext('2d');
    for (let i = 0; i < 12; i++) {
      ctx.fillStyle = 'hsl(' + (i * 30) + ',80%,50%)'; ctx.fillRect(0, 0, 1920, 1080);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 80px sans-serif'; ctx.fillText('frame ' + i, 100, 500);
      const f = new VideoFrame(canvas, { timestamp: i * 16666, duration: 16666 });
      enc.encode(f, { keyFrame: i % 30 === 0 });
      f.close();
    }
    await enc.flush();
    enc.close();
    r.encodedOk = gotChunk;
  } catch (e) { r.error = String(e); }
  return r;
};
</script></body></html>
